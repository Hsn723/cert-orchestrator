name: Release Helm chart
on:
  push:
    branches:
      - master
    paths:
      - 'charts/**/Chart.yaml'
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: hsn723/actions/.github/workflows/helm-release.yml@bd05ba2349bb5069aa84e061397f491ef75ffe4e # v1.0.49
    secrets: inherit
    with:
      upload_as_oci: true
      chart_name: cert-orchestrator
