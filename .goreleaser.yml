project_name: cert-orchestrator
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd
    binary: cert-orchestrator
    goos:
      - linux
    goarch:
      - amd64
      - arm64
dockers_v2:
  - images:
      - "ghcr.io/hsn723/{{.ProjectName}}"
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
    extra_files:
      - LICENSE
    annotations:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
    labels:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  use: github-native
source:
  enabled: true
sboms:
  - id: archive
    artifacts: archive
    env:
      - AQUA_GLOBAL_CONFIG={{ .Env.AQUA_GLOBAL_CONFIG }}
  - id: source
    artifacts: source
    env:
      - AQUA_GLOBAL_CONFIG={{ .Env.AQUA_GLOBAL_CONFIG }}
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--yes'
      - '--bundle=${signature}'
      - '${artifact}'
    artifacts: all
    output: true
docker_signs:
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - 'sign'
      - '--yes'
      - '${artifact}@${digest}'
docker_digest:
  name_template: 'digests.txt'
