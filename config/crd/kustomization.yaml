# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/cert-orchestrator.atelierhsn.com_certificatesets.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
  - target:
      kind: CustomResourceDefinition
      name: certificatesets.cert-orchestrator.atelierhsn.com
    patch: |-
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/required
