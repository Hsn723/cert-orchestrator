# This rule is not used by the project cert-orchestrator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cert-orchestrator.atelierhsn.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cert-orchestrator
    app.kubernetes.io/managed-by: kustomize
  name: certificateset-admin-role
rules:
- apiGroups:
  - cert-orchestrator.atelierhsn.com
  resources:
  - certificatesets
  verbs:
  - '*'
- apiGroups:
  - cert-orchestrator.atelierhsn.com
  resources:
  - certificatesets/status
  verbs:
  - get
