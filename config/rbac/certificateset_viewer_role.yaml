# This rule is not used by the project cert-orchestrator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cert-orchestrator.atelierhsn.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cert-orchestrator
    app.kubernetes.io/managed-by: kustomize
  name: certificateset-viewer-role
rules:
- apiGroups:
  - cert-orchestrator.atelierhsn.com
  resources:
  - certificatesets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-orchestrator.atelierhsn.com
  resources:
  - certificatesets/status
  verbs:
  - get
