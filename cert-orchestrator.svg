<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>Certificate orchestration architecture</title>
  <desc>User deploys a CertificateSet. cert-orchestrator watches it and reconciles Certificate A and B. cert-manager reconciles those same Certificate resources and creates Secret A and Secret B. cert-orchestrator watches both Secrets and reconciles the Canonical Secret.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324D" flood-opacity=".12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#287FA8"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C94D83"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#239B70"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .heading { font-size: 17px; font-weight: 700; letter-spacing: 1.7px; fill: #64748B; }
      .name { font-size: 23px; font-weight: 700; fill: #173B52; }
      .sub { font-size: 15px; font-weight: 500; fill: #557083; }
      .step { font-size: 15px; font-weight: 700; fill: #7B3155; }
      .stepBlue { font-size: 15px; font-weight: 700; fill: #155B7B; }
      .num { font-size: 15px; font-weight: 800; fill: white; text-anchor: middle; dominant-baseline: central; }
      .lineBlue { fill: none; stroke: #287FA8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .linePink { fill: none; stroke: #C94D83; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPink); }
      .lineGreen { fill: none; stroke: #239B70; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .guide { fill: none; stroke: #D7E2E9; stroke-width: 1.5; stroke-dasharray: 5 8; }
    </style>
  </defs>

  <!-- transparent canvas; restrained stage guides -->
  <text x="90" y="76" class="heading">CONFIGURATION</text>
  <path d="M90 94 H1510" class="guide"/>

  <!-- User -->
  <g transform="translate(105 145)">
    <circle cx="42" cy="25" r="19" fill="#FFFFFF" stroke="#0E949A" stroke-width="3"/>
    <path d="M9 88 C10 61 25 49 42 49 C59 49 74 61 75 88 Z" fill="#E7F7F6" stroke="#0E949A" stroke-width="3" stroke-linejoin="round"/>
    <text x="42" y="119" text-anchor="middle" class="name" font-size="19">User</text>
  </g>

  <!-- CertificateSet -->
  <g filter="url(#shadow)">
    <rect x="365" y="140" width="370" height="112" rx="18" fill="#FCE8F1" stroke="#EB6EA5" stroke-width="2.5"/>
  </g>
  <g transform="translate(397 171)" fill="none" stroke="#C94D83" stroke-width="3" stroke-linejoin="round">
    <path d="M0 15 L29 0 L58 15 L29 30 Z" fill="#EB6EA5"/>
    <path d="M0 29 L29 44 L58 29"/>
    <path d="M0 43 L29 58 L58 43"/>
  </g>
  <text x="485" y="190" class="name">CertificateSet</text>
  <text x="485" y="218" class="sub">Custom resource</text>

  <!-- Main orchestration stage -->
  <text x="90" y="330" class="heading">ORCHESTRATION &amp; ISSUANCE</text>
  <path d="M90 348 H1510" class="guide"/>

  <!-- cert-orchestrator -->
  <g filter="url(#shadow)">
    <rect x="365" y="390" width="370" height="118" rx="18" fill="#E2F3F9" stroke="#0075C2" stroke-width="2.5"/>
  </g>
  <g transform="translate(397 423)" fill="none" stroke="#0075C2" stroke-width="3">
    <circle cx="28" cy="27" r="24"/>
    <path d="M28 8 V46 M9 27 H47 M14 13 L42 41 M42 13 L14 41"/>
    <circle cx="28" cy="27" r="7" fill="#64BDD4" stroke="#0075C2"/>
  </g>
  <text x="470" y="441" class="name">cert-orchestrator</text>
  <text x="470" y="470" class="sub">Watches resources · selects active certificate</text>

  <!-- cert-manager -->
  <g filter="url(#shadow)">
    <rect x="100" y="620" width="300" height="112" rx="18" fill="#E2F3F9" stroke="#0075C2" stroke-width="2.5"/>
  </g>
  <g transform="translate(128 650)" fill="none" stroke="#0075C2" stroke-width="3">
    <circle cx="26" cy="26" r="23"/>
    <path d="M26 8 V44 M8 26 H44 M13 13 L39 39 M39 13 L13 39"/>
  </g>
  <text x="190" y="670" class="name">cert-manager</text>
  <text x="190" y="698" class="sub">Issues certificates</text>

  <!-- Shared Certificate resources: each resource is a single node -->
  <text x="800" y="330" class="heading">CERTIFICATE RESOURCES</text>
  <g filter="url(#shadow)">
    <rect x="800" y="390" width="270" height="88" rx="15" fill="#DDF3F8" stroke="#64BDD4" stroke-width="2.5"/>
    <rect x="800" y="510" width="270" height="88" rx="15" fill="#DDF3F8" stroke="#64BDD4" stroke-width="2.5"/>
  </g>
  <g transform="translate(826 416)" stroke="#087C9D" stroke-width="2.5" fill="#64BDD4">
    <path d="M18 0 L34 6 V20 C34 31 26 39 18 43 C10 39 2 31 2 20 V6 Z"/>
    <path d="M18 8 V31" stroke="#EAFBFF"/>
  </g>
  <g transform="translate(826 536)" stroke="#087C9D" stroke-width="2.5" fill="#64BDD4">
    <path d="M18 0 L34 6 V20 C34 31 26 39 18 43 C10 39 2 31 2 20 V6 Z"/>
    <path d="M18 8 V31" stroke="#EAFBFF"/>
  </g>
  <text x="880" y="443" class="name">Certificate A</text>
  <text x="880" y="563" class="name">Certificate B</text>

  <!-- Secrets -->
  <text x="1150" y="330" class="heading">KUBERNETES SECRETS</text>
  <g filter="url(#shadow)">
    <rect x="1150" y="390" width="220" height="88" rx="15" fill="#FCE8F1" stroke="#EB6EA5" stroke-width="2.5"/>
    <rect x="1150" y="510" width="220" height="88" rx="15" fill="#FCE8F1" stroke="#EB6EA5" stroke-width="2.5"/>
  </g>
  <g transform="translate(1178 416)" fill="#EB6EA5" stroke="#B83F75" stroke-width="2">
    <path d="M3 0 H25 L38 13 V43 H3 Z"/>
    <path d="M25 0 V13 H38" fill="none"/>
    <path d="M10 23 H30 M10 31 H30" stroke="#FFFFFF"/>
  </g>
  <g transform="translate(1178 536)" fill="#EB6EA5" stroke="#B83F75" stroke-width="2">
    <path d="M3 0 H25 L38 13 V43 H3 Z"/>
    <path d="M25 0 V13 H38" fill="none"/>
    <path d="M10 23 H30 M10 31 H30" stroke="#FFFFFF"/>
  </g>
  <text x="1230" y="443" class="name">Secret A</text>
  <text x="1230" y="563" class="name">Secret B</text>

  <!-- Canonical output -->
  <g filter="url(#shadow)">
    <rect x="1405" y="435" width="170" height="120" rx="18" fill="#E1F8EE" stroke="#48B98C" stroke-width="2.5"/>
  </g>
  <g transform="translate(1468 456)" fill="none" stroke="#239B70" stroke-width="5" stroke-linecap="round">
    <circle cx="18" cy="15" r="11"/>
    <path d="M27 22 L47 42 M39 34 L45 28 M45 40 L51 34"/>
  </g>
  <text x="1490" y="526" text-anchor="middle" class="name" font-size="19">Canonical</text>
  <text x="1490" y="550" text-anchor="middle" class="name" font-size="19">Secret</text>

  <!-- Configuration and watch flows -->
  <path d="M190 190 H350" class="linePink"/>
  <g transform="translate(230 157)">
    <rect width="112" height="28" rx="14" fill="#FFF3F8" stroke="#EB6EA5"/>
    <circle cx="15" cy="14" r="10" fill="#C94D83"/>
    <text x="15" y="14" class="num">1</text>
    <text x="32" y="19" class="step">Deploy</text>
  </g>

  <path d="M550 390 V270" class="linePink"/>
  <g transform="translate(565 294)">
    <rect width="102" height="28" rx="14" fill="#FFF3F8" stroke="#EB6EA5"/>
    <circle cx="15" cy="14" r="10" fill="#C94D83"/>
    <text x="15" y="14" class="num">2</text>
    <text x="32" y="19" class="step">Watch</text>
  </g>

  <!-- Orchestrator reconciles the same Certificate A/B nodes cert-manager consumes -->
  <path d="M735 430 H782 V434 H790" class="lineBlue"/>
  <path d="M735 468 H765 V554 H790" class="lineBlue"/>
  <g transform="translate(735 350)">
    <rect width="132" height="28" rx="14" fill="#EDF8FC" stroke="#64BDD4"/>
    <circle cx="15" cy="14" r="10" fill="#287FA8"/>
    <text x="15" y="14" class="num">3</text>
    <text x="32" y="19" class="stepBlue">Reconcile</text>
  </g>

  <!-- cert-manager reconciles those exact same Certificate nodes -->
  <path d="M400 655 H690 V434 H790" class="lineBlue"/>
  <path d="M400 697 H720 V554 H790" class="lineBlue"/>
  <g transform="translate(500 610)">
    <rect width="132" height="28" rx="14" fill="#EDF8FC" stroke="#64BDD4"/>
    <circle cx="15" cy="14" r="10" fill="#287FA8"/>
    <text x="15" y="14" class="num">4</text>
    <text x="32" y="19" class="stepBlue">Reconcile</text>
  </g>

  <!-- cert-manager creates Secrets A/B -->
  <path d="M400 714 H1088 V434 H1140" class="linePink"/>
  <path d="M400 724 H1108 V554 H1140" class="linePink"/>
  <g transform="translate(830 638)">
    <rect width="142" height="28" rx="14" fill="#FFF3F8" stroke="#EB6EA5"/>
    <circle cx="15" cy="14" r="10" fill="#C94D83"/>
    <text x="15" y="14" class="num">5</text>
    <text x="32" y="19" class="step">Create Secret</text>
  </g>

  <!-- Orchestrator watches Secrets A/B -->
  <path d="M735 490 H1120 V434 H1140" class="linePink"/>
  <path d="M735 500 H1130 V554 H1140" class="linePink"/>
  <g transform="translate(965 365)">
    <rect width="102" height="28" rx="14" fill="#FFF3F8" stroke="#EB6EA5"/>
    <circle cx="15" cy="14" r="10" fill="#C94D83"/>
    <text x="15" y="14" class="num">6</text>
    <text x="32" y="19" class="step">Watch</text>
  </g>

  <!-- The orchestrator creates/updates the canonical Secret after observing source Secrets -->
  <path d="M735 449 H760 V270 H1390 V495 H1395" class="lineGreen"/>
  <g transform="translate(1045 256)">
    <rect width="190" height="28" rx="14" fill="#EAF9F2" stroke="#48B98C"/>
    <circle cx="15" cy="14" r="10" fill="#239B70"/>
    <text x="15" y="14" class="num">7</text>
    <text x="32" y="19" font-size="14" font-weight="700" fill="#176B50">Create / update Secret</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100 850)">
    <rect x="0" y="0" width="1400" height="72" rx="14" fill="#FFFFFF" fill-opacity=".78" stroke="#D8E3EA"/>
    <circle cx="34" cy="36" r="6" fill="#287FA8"/>
    <path d="M48 36 H88" stroke="#287FA8" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="102" y="42" class="sub">Resource reconciliation</text>
    <circle cx="390" cy="36" r="6" fill="#C94D83"/>
    <path d="M404 36 H444" stroke="#C94D83" stroke-width="3" marker-end="url(#arrowPink)"/>
    <text x="458" y="42" class="sub">Watch / Secret creation</text>
    <circle cx="790" cy="36" r="6" fill="#239B70"/>
    <path d="M804 36 H844" stroke="#239B70" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="858" y="42" class="sub">Selected output</text>
    <text x="1190" y="42" class="sub" text-anchor="middle">Transparent background</text>
  </g>
</svg>