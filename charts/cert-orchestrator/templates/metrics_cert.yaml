{{- if .Values.metrics.certificate.enabled }}
{{- if not .Values.metrics.enabled }}
{{- fail "metrics.certificate.enabled requires metrics.enabled" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cert-orchestrator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "cert-orchestrator.fullname" . }}-metrics-cert
  dnsNames:
    - {{ include "cert-orchestrator.fullname" . }}-metrics.{{ .Release.Namespace }}.svc
    - {{ include "cert-orchestrator.fullname" . }}-metrics.{{ .Release.Namespace }}.svc.{{ .Values.metrics.certificate.clusterDomain }}
  issuerRef:
    name: {{ required "metrics.certificate.issuerName is required when metrics.certificate.enabled is true" .Values.metrics.certificate.issuerName }}
    kind: Issuer
{{- end }}
